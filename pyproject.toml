[build-system]
requires = ["scikit-build-core", "pybind11>=3.0.4"]
build-backend = "scikit_build_core.build"

[project]
name = "S1_SDK"
version = "0.1.0"
description = "SDK for Theseus S1  arm"
authors = [{name = "theseus", email = "temp@temp.com"}]
readme = "readme.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "mujoco==3.4.0",
    "pynput",
    "pybind11>=3.0.4",
]

[tool.scikit-build]
wheel.packages = ["src/S1_SDK"]
build.verbose = true
cmake.build-type = "Release"

[tool.uv.workspace]
members = [
    "my-project",
]
